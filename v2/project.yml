name: WhisperClipboard

# macOS 26 deployment target: the primary transcription engine is the
# macOS-26 SpeechAnalyzer API, so we cannot target anything older.
options:
  bundleIdPrefix: nl.nielscroiset
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete # Swift 6 language mode
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is deliberately parameterized so the SAME project builds two ways:
    #   • Local dev / CI (this file as-is): ad-hoc identity "-", no team, so a
    #     plain `xcodebuild` runs without a Developer account or provisioning.
    #   • Release for distribution: Packaging/build_release.sh passes real values
    #     on the command line (CODE_SIGN_IDENTITY="Developer ID Application: …",
    #     DEVELOPMENT_TEAM=<TEAMID>) which OVERRIDE the placeholders below.
    # Do NOT hardcode a real Developer ID here — that would break every ad-hoc
    # build (including the Release verify build) for anyone without that cert.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Hardened runtime is required for Developer-ID notarization. It is enabled
    # per-config below: ON for Release (works fine with an ad-hoc identity too,
    # so the local verify build still succeeds) and OFF for Debug so day-to-day
    # development is unencumbered (debugger attach, dyld env vars, etc.).
    ENABLE_HARDENED_RUNTIME: false
  configs:
    Debug:
      # Explicit for clarity: no hardened runtime while developing.
      ENABLE_HARDENED_RUNTIME: false
    Release:
      # Developer-ID distribution build. Hardened runtime + a secure timestamp
      # are prerequisites for notarization; both are compatible with ad-hoc
      # signing locally, so the Release verify build (ad-hoc) still passes.
      ENABLE_HARDENED_RUNTIME: true
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  # NVIDIA Parakeet TDT 0.6b v3 (multilingual, incl. Dutch) CoreML via FluidAudio.
  # v0.15.4 is the latest release; the README's `from: 0.12.4` is stale relative
  # to the API this app compiles against (progress handlers, ParakeetEncoderPrecision).
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.15.4"
  # SQLite toolkit backing the history store (transcripts table + FTS5 search).
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  # Sparkle 2 in-app auto-updates. The app is NON-sandboxed, so we use the simple
  # integration: link the framework directly (no XPC Installer/Downloader services
  # or sandbox plumbing needed). 2.6+ ships as a proper SPM binary framework.
  # Pinned to a 2.x minimum; 2.9.4 is the latest at time of writing.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  Core:
    path: Packages/Core

targets:
  WhisperClipboard:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: WhisperClipboard
        excludes:
          - "Resources/Info.plist"
          - "WhisperClipboard.entitlements"
          # Fonts are copied intact into Contents/Resources/Fonts by the
          # postCompileScripts phase below (ATSApplicationFontsPath = Fonts).
          - "Resources/Fonts"
    dependencies:
      - package: KeyboardShortcuts
      - package: Core
      - package: FluidAudio
      - package: GRDB
        product: GRDB
      - package: Sparkle
    postCompileScripts:
      - name: Copy bundled fonts into Resources/Fonts
        basedOnDependencyAnalysis: false
        script: |
          FONTS_SRC="${SRCROOT}/WhisperClipboard/Resources/Fonts"
          FONTS_DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Fonts"
          rm -rf "${FONTS_DST}"
          mkdir -p "${FONTS_DST}"
          cp -R "${FONTS_SRC}/." "${FONTS_DST}/"
    info:
      path: WhisperClipboard/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: nl
        CFBundleDisplayName: Whisper Clipboard
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu bar app: no Dock icon by default (toggled to .regular at runtime).
        LSUIElement: true
        NSMicrophoneUsageDescription: "Whisper Clipboard gebruikt de microfoon om je spraak lokaal op je Mac om te zetten naar tekst. Er verlaat geen audio je computer."
        NSAudioCaptureUsageDescription: "Whisper Clipboard gebruikt systeemaudio om live ondertitels te maken van wat er op je Mac klinkt. Er verlaat geen audio je computer."
        ATSApplicationFontsPath: Fonts
        NSHumanReadableCopyright: "© 2026 NightStory"
        # --- Sparkle 2 auto-update configuration ---
        # SUFeedURL: the appcast Sparkle polls for new versions.
        # TODO(release): replace USER/whisper-clipboard with the real GitHub repo
        # once the public repo exists. This "latest release" URL always points at
        # the appcast.xml uploaded to the most recent GitHub Release.
        SUFeedURL: "https://github.com/USER/whisper-clipboard/releases/latest/download/appcast.xml"
        # EdDSA public key. Sparkle verifies every downloaded update against this.
        # The matching PRIVATE key lives ONLY in the login keychain (service
        # "https://sparkle-project.org", account "nl.nielscroiset.whisperclipboard");
        # see Packaging/RELEASING.md. It must NEVER be committed. Generated with
        # Sparkle 2.9.4 `generate_keys` on 2026-07-03.
        SUPublicEDKey: "ykAoJsoYRdrAQb2cN0p7GPcLUxjTKwEwDmNeUkWPmEI="
        # Check automatically, but ask the user before the first automatic check
        # (Sparkle shows a one-time "check for updates automatically?" prompt).
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: WhisperClipboard/WhisperClipboard.entitlements
      properties:
        # Microphone access under hardened runtime. This is the ONLY entitlement
        # the app needs: it is non-sandboxed (no app-sandbox key), performs no
        # JIT, loads no unsigned code, and does not disable library validation
        # (all linked frameworks — Sparkle, FluidAudio, GRDB, KeyboardShortcuts —
        # are signed by the same Developer ID during packaging). See PRIVACY.md.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.nielscroiset.whisperclipboard
        PRODUCT_NAME: WhisperClipboard
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"

  WhisperClipboardTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - WhisperClipboardTests
    dependencies:
      - target: WhisperClipboard
      - package: GRDB
        product: GRDB
      - package: Core
      # FluidAudio is used by the gated diarization E2E test (SystemInfo guard).
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.nielscroiset.whisperclipboardTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"

schemes:
  WhisperClipboard:
    build:
      targets:
        WhisperClipboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhisperClipboardTests
