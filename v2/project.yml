name: WhisperClipboard

# macOS 26 deployment target: the primary transcription engine is the
# macOS-26 SpeechAnalyzer API, so we cannot target anything older.
options:
  bundleIdPrefix: nl.nielscroiset
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete # Swift 6 language mode
    MARKETING_VERSION: "2.0.1"
    CURRENT_PROJECT_VERSION: "5"
    # Signing is deliberately parameterized so the SAME project builds two ways:
    #   • Local dev / CI (this file as-is): ad-hoc identity "-", no team, so a
    #     plain `xcodebuild` runs without a Developer account or provisioning.
    #   • Release for distribution: Packaging/build_release.sh passes real values
    #     on the command line (CODE_SIGN_IDENTITY="Developer ID Application: …",
    #     DEVELOPMENT_TEAM=<TEAMID>) which OVERRIDE the placeholders below.
    # Do NOT hardcode a real Developer ID here — that would break every ad-hoc
    # build (including the Release verify build) for anyone without that cert.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Hardened runtime is required for Developer-ID notarization. It is enabled
    # per-config below: ON for Release (works fine with an ad-hoc identity too,
    # so the local verify build still succeeds) and OFF for Debug so day-to-day
    # development is unencumbered (debugger attach, dyld env vars, etc.).
    ENABLE_HARDENED_RUNTIME: false
  configs:
    Debug:
      # Explicit for clarity: no hardened runtime while developing.
      ENABLE_HARDENED_RUNTIME: false
    Release:
      # Developer-ID distribution build. Hardened runtime + a secure timestamp
      # are prerequisites for notarization; both are compatible with ad-hoc
      # signing locally, so the Release verify build (ad-hoc) still passes.
      ENABLE_HARDENED_RUNTIME: true
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  # NVIDIA Parakeet TDT 0.6b v3 (multilingual, incl. Dutch) CoreML via FluidAudio.
  # v0.15.4 is the latest release; the README's `from: 0.12.4` is stale relative
  # to the API this app compiles against (progress handlers, ParakeetEncoderPrecision).
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.15.4"
  # SQLite toolkit backing the history store (transcripts table + FTS5 search).
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  # Sparkle 2 in-app auto-updates. The app is NON-sandboxed, so we use the simple
  # integration: link the framework directly (no XPC Installer/Downloader services
  # or sandbox plumbing needed). 2.6+ ships as a proper SPM binary framework.
  # Pinned to a 2.x minimum; 2.9.4 is the latest at time of writing.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  Core:
    path: Packages/Core
  # Cross-platform (macOS + iOS) layer shared by the mac app and the iOS
  # companion: the TranscriptionEngine protocol + ParakeetEngine, the GRDB
  # HistoryStore/schema/records, AppSupport, and TranscriptSourceStyle. Depends
  # on Core, GRDB and FluidAudio via its own manifest.
  WhisperShared:
    path: Packages/Shared

targets:
  WhisperClipboard:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: WhisperClipboard
        excludes:
          - "Resources/Info.plist"
          - "WhisperClipboard.entitlements"
          # iCloud release-variant entitlements (superset). NOT the default
          # entitlements — used only by the Developer-ID release signing step
          # (see Packaging/RELEASING.md). Excluded so it isn't compiled as source.
          - "WhisperClipboard-iCloud.entitlements"
          # Fonts are copied intact into Contents/Resources/Fonts by the
          # postCompileScripts phase below (ATSApplicationFontsPath = Fonts).
          - "Resources/Fonts"
    dependencies:
      - package: KeyboardShortcuts
      - package: Core
      - package: WhisperShared
      - package: FluidAudio
      - package: GRDB
        product: GRDB
      - package: Sparkle
    postCompileScripts:
      - name: Copy bundled fonts into Resources/Fonts
        basedOnDependencyAnalysis: false
        script: |
          FONTS_SRC="${SRCROOT}/WhisperClipboard/Resources/Fonts"
          FONTS_DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Fonts"
          rm -rf "${FONTS_DST}"
          mkdir -p "${FONTS_DST}"
          cp -R "${FONTS_SRC}/." "${FONTS_DST}/"
    info:
      path: WhisperClipboard/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: nl
        CFBundleDisplayName: WhisperClip
        CFBundleName: WhisperClip
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu bar app: no Dock icon by default (toggled to .regular at runtime).
        LSUIElement: true
        NSMicrophoneUsageDescription: "WhisperClip gebruikt de microfoon om je spraak lokaal op je Mac om te zetten naar tekst. Er verlaat geen audio je computer."
        NSAudioCaptureUsageDescription: "WhisperClip gebruikt systeemaudio om live ondertitels te maken van wat er op je Mac klinkt. Er verlaat geen audio je computer."
        ATSApplicationFontsPath: Fonts
        NSHumanReadableCopyright: "© 2026 NightStory"
        # --- Sparkle 2 auto-update configuration ---
        # SUFeedURL: de appcast die Sparkle raadpleegt voor nieuwe versies.
        #
        # BEWUST LEEG (bevinding 2026-08-03). Hier stond de letterlijke
        # placeholder https://github.com/USER/whisper-clipboard/… Die naamruimte
        # is door niemand geclaimd: iedereen kan het GitHub-account "USER"
        # registreren en daarmee de updatefeed van deze NIET-gesandboxte app
        # bepalen. Met SUEnableAutomaticChecks = true deed de app daar ook nog
        # eens uit zichzelf periodiek uitgaande verzoeken naartoe.
        #
        # Een lege string is onmiskenbaar inert: Sparkle heeft geen feed en
        # AppDelegate.updateFeedConfigured (die op !feed.isEmpty controleert)
        # blijft false, dus de updater start niet en het menu-item blijft
        # verborgen. Geen verzonnen URL: vul dit pas in met de ECHTE publieke
        # release-locatie, en zet SUEnableAutomaticChecks dan pas weer aan.
        SUFeedURL: ""
        # EdDSA public key. Sparkle verifies every downloaded update against this.
        # The matching PRIVATE key lives ONLY in the login keychain (service
        # "https://sparkle-project.org", account "nl.nielscroiset.whisperclipboard");
        # see Packaging/RELEASING.md. It must NEVER be committed. Generated with
        # Sparkle 2.9.4 `generate_keys` on 2026-07-03.
        SUPublicEDKey: "ykAoJsoYRdrAQb2cN0p7GPcLUxjTKwEwDmNeUkWPmEI="
        # UIT (bevinding 2026-08-03): automatisch controleren mag pas zodra
        # SUFeedURL hierboven een echte, door onszelf beheerde feed is. Anders
        # praat de app periodiek uit zichzelf met een adres dat een derde kan
        # overnemen. Het interval blijft staan zodat het klopt zodra dit weer aan
        # gaat; zonder automatische controle doet het niets.
        SUEnableAutomaticChecks: false
        SUScheduledCheckInterval: 86400
    entitlements:
      path: WhisperClipboard/WhisperClipboard.entitlements
      properties:
        # Microphone access under hardened runtime. This is the ONLY entitlement
        # the app needs: it is non-sandboxed (no app-sandbox key), performs no
        # JIT, loads no unsigned code, and does not disable library validation
        # (all linked frameworks — Sparkle, FluidAudio, GRDB, KeyboardShortcuts —
        # are signed by the same Developer ID during packaging). See PRIVACY.md.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.nielscroiset.whisperclipboard
        # De app heet ook als PRODUCT "Whisper Clip": macOS toont in het
        # appmenu en de Dock de naam van de executable/.app-bundel, dus alleen
        # CFBundleName/DisplayName aanpassen was niet genoeg. Target- en
        # schemanaam blijven "WhisperClipboard" (geen spatie in paden/CI).
        PRODUCT_NAME: "WhisperClip"
        # De Swift-module blijft "WhisperClipboard": anders wordt hij
        # "Whisper_Clip" en breekt elke `@testable import WhisperClipboard`.
        PRODUCT_MODULE_NAME: WhisperClipboard
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "2.0.1"
        CURRENT_PROJECT_VERSION: "5"

  WhisperClipboardTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - WhisperClipboardTests
    dependencies:
      - target: WhisperClipboard
      - package: GRDB
        product: GRDB
      - package: Core
      - package: WhisperShared
      # FluidAudio is used by the gated diarization E2E test (SystemInfo guard).
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.nielscroiset.whisperclipboardTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"
        # XcodeGen leidt TEST_HOST af van de TARGETnaam, maar het product heet
        # sinds de hernoeming "Whisper Clip.app" — expliciet zetten dus, anders
        # vindt xcodebuild de host-app niet ("Could not find test host").
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WhisperClip.app/Contents/MacOS/WhisperClip"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # iOS companion app. Record → transcribe locally with Parakeet (Dutch) →
  # history. Shares the data + engine layer with the mac app via WhisperShared;
  # its history DB lives in this app's own sandboxed Application Support.
  WhisperClipboardiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WhisperClipboardiOS
        excludes:
          - "Resources/Info.plist"
          - "WhisperClipboardiOS.entitlements"
          # Fonts are copied intact into the app bundle root by the
          # postCompileScripts phase below (UIAppFonts references them by name).
          - "Resources/Fonts"
      # Personal gebruikt dezelfde transportclient als de Mac. De Public-target
      # krijgt deze bronbestanden nadrukkelijk niet.
      - path: WhisperClipboard/PLAUD/PlaudClient.swift
      - path: WhisperClipboard/PLAUD/PlaudClient+Wire.swift
    dependencies:
      - package: Core
      - package: WhisperShared
      - package: FluidAudio
      - package: GRDB
        product: GRDB
      # De widget-extensie (Live Activity). xcodegen bedt een app_extension-
      # target automatisch in wanneer die als dependency wordt opgevoerd.
      - target: WhisperClipboardiOSWidgets
    postCompileScripts:
      - name: Copy bundled fonts into the app bundle
        basedOnDependencyAnalysis: false
        script: |
          FONTS_SRC="${SRCROOT}/WhisperClipboardiOS/Resources/Fonts"
          FONTS_DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${FONTS_DST}"
          cp "${FONTS_SRC}/Inter.ttf" "${FONTS_DST}/"
          cp "${FONTS_SRC}/Merriweather.ttf" "${FONTS_DST}/"
    info:
      path: WhisperClipboardiOS/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: nl
        CFBundleDisplayName: WhisperClip
        CFBundleName: WhisperClip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Alleen vrijgestelde standaardversleuteling (HTTPS, Keychain en
        # Apple-systeemdiensten); geen zelf geïmplementeerde/non-exempt crypto.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Portrait-primary: the record UI is a single vertical column.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "WhisperClip gebruikt de microfoon om je spraak lokaal op je iPhone om te zetten naar tekst. Er verlaat geen audio je toestel."
        # Achtergrond-opname: laat de mic-capture doorlopen wanneer de app op de
        # achtergrond staat of het scherm vergrendeld is.
        UIBackgroundModes:
          - audio
        # Live Activity (Dynamic Island + lock-screen banner) tijdens de opname.
        NSSupportsLiveActivities: true
        # Bundled Inter (UI) + Merriweather (wordmark) fonts.
        UIAppFonts:
          - Inter.ttf
          - Merriweather.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.nielscroiset.whisperclipboard.ios
        PRODUCT_NAME: WhisperClipboardiOS
        GENERATE_INFOPLIST_FILE: false
        # iCloud CloudKit entitlements (i2). Only validated at signing, so with
        # CODE_SIGNING_ALLOWED=NO the generic-device verify build still compiles;
        # a real TestFlight/device build supplies a matching provisioning profile.
        CODE_SIGN_ENTITLEMENTS: WhisperClipboardiOS/WhisperClipboardiOS.entitlements
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "2.0.1"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WHISPERCLIP_PERSONAL"
        # Ad-hoc / dev signing so simulator + generic device builds run without a
        # Developer account. Real signing is supplied on the command line for a
        # device/TestFlight build (mirrors the mac target's parameterization).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""

  # WidgetKit-extensie van de iOS-app. Bevat alleen de Live Activity (Dynamic
  # Island + lock-screen banner) voor een lopende opname. Bewust licht: geen
  # GRDB/FluidAudio — alle data reist via de ActivityAttributes/ContentState.
  WhisperClipboardiOSWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WhisperClipboardiOSWidgets
      # Gedeeld attributes-type: in BEIDE targets meegecompileerd (niet via
      # WhisperShared — dat zou GRDB/FluidAudio de extensie in trekken).
      - path: WhisperClipboardiOS/Shared/RecordingActivityAttributes.swift
      # Stop-intent + RecordingStopBus: óók in BEIDE targets. De widget refereert
      # StopRecordingIntent in Button(intent:); de app voert perform() uit (die
      # draait in het app-proces). RecordingStopBus/RecordingStopHandling worden
      # in de widget niet gebruikt maar horen bij hetzelfde bestand — onschadelijk
      # (geen GRDB/FluidAudio-afhankelijkheid).
      - path: WhisperClipboardiOS/Shared/StopRecordingIntent.swift
    info:
      path: WhisperClipboardiOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: WhisperClip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.nielscroiset.whisperclipboard.ios.widgets
        PRODUCT_NAME: WhisperClipboardiOSWidgets
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "2.0.1"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        # Zelfde ad-hoc/dev-signing als de app zodat CI/dev-builds niet breken.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""

schemes:
  WhisperClipboard:
    build:
      targets:
        WhisperClipboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhisperClipboardTests

  WhisperClipboardiOS:
    build:
      targets:
        WhisperClipboardiOS: all
    run:
      config: Debug
